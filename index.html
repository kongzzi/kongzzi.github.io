<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kongzzi ✿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Floating decorations -->
  <div class="deco deco1" aria-hidden="true">🌸</div>
  <div class="deco deco2" aria-hidden="true">⭐</div>
  <div class="deco deco3" aria-hidden="true">🍀</div>
  <div class="deco deco4" aria-hidden="true">🌙</div>
  <div class="deco deco5" aria-hidden="true">✨</div>
  <div class="deco deco6" aria-hidden="true">🌷</div>

  <main class="hero">
    <header class="hero__header">
      <p class="hero__greeting">안녕하세요 ✿</p>
      <h1 class="hero__title">kongzzi</h1>
      <p class="hero__subtitle">welcome to my little space 🌿</p>
    </header>

    <section class="cards" aria-label="카테고리">

      <!-- WORK -->
      <article class="card card--work">
        <div class="card__icon" aria-hidden="true">💼</div>
        <h2 class="card__label">WORK</h2>
        <p class="card__desc">&nbsp;</p>
        <span class="card__badge">coming soon ✦</span>
      </article>

      <!-- LIKE -->
      <article class="card card--like">
        <div class="card__icon" aria-hidden="true">🩷</div>
        <h2 class="card__label">LIKE</h2>
        <p class="card__desc">&nbsp;</p>
        <span class="card__badge">coming soon ✦</span>
      </article>

      <!-- LINK -->
      <article class="card card--link">
        <div class="card__icon" aria-hidden="true">🔗</div>
        <h2 class="card__label">LINK</h2>
        <p class="card__desc">&nbsp;</p>
        <span class="card__badge">coming soon ✦</span>
      </article>

    </section>
  </main>

  <footer class="footer">
    <p>made with 💕 by kongzzi</p>
  </footer>

</body>
</html>
